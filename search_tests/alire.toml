[[pins]]
project_tools = { path = "../../project_tools" }

[[pins]]
files = { path = "../../files" }

[[pins]]
guikit = { path = "../../guikit" }

[[pins]]
i18n = { path = "../../i18n" }

[[pins]]
messages = { path = "../../messages" }

[[pins]]
regexp = { path = "../../regexp" }

[[pins]]
versionlib = { path = "../../versionlib" }

[[pins]]
hostkit = { path = "../../hostkit" }

[[pins]]
textrender = { path = "../../textrender" }

[[pins]]
zlib = { path = "../../zlib" }

[[pins]]
cryptolib = { path = "../../cryptolib" }

[build-profiles]
"*" = "development"
