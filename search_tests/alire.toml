name = "search_tests"
description = "AUnit and release validation suite for search"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
tags = ["test", "suite"]

executables = ["search_tests", "search_release_check"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
search = "*"

[[depends-on]]
aunit = "^26.0.0"

[[depends-on]]
