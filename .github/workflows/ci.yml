name: ci

# Builds search and runs its AUnit suite on Linux, macOS and Windows.
#
# search pins sibling crates by path and pulls in more transitively (guikit,
# textrender, hostkit, versionlib, regexp, messages, humanize, i18n,
# project_tools, httpclient, sshlib, zlib, cryptolib, tarlib, awklib). CI clones
# each next to the checkout; they must exist as fetchable GitHub repos under the
# same owner. (It no longer depends on files: its fonts come from Guikit.Fonts.)
#
# search-desktop renders through guikit (Vulkan + GLFW), so every job installs
# the Vulkan/GLFW stack, and renders a real search (--smoke) with Mesa's
# lavapipe software Vulkan. Building i18n runs its pre-build regeneration --
# download_tzdb (httpclient, zlib, tarlib, awklib-on-regexp) and the CLDR
# import -- which links OpenSSL, so each platform installs that too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # x86_64 macOS: gnat_native=15.2.1 ships no aarch64-darwin binary, so
        # macos-latest (arm64) cannot resolve the pin; macos-15-intel is the last
        # x86_64 image Actions offers.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { path: search }
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: search

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            xvfb \
            fonts-dejavu-core \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use the runner image's coherent Homebrew snapshot, as files does. A
          # brew update moved gdk-pixbuf onto openssl@4, which has no Intel bottle,
          # and building it from source ran past the job timeout.
          export HOMEBREW_NO_AUTO_UPDATE=1
          # The Intel image can keep a dangling openssl@1.1 link that makes an
          # otherwise successful openssl upgrade report failure.
          brew unlink openssl@1.1 || true
          if [ -L /usr/local/bin/openssl ] &&
             [[ "$(readlink /usr/local/bin/openssl)" == *openssl@1.1* ]]; then
            unlink /usr/local/bin/openssl
          fi
          # MoltenVK provides the Vulkan loader/ICD.
          # openssl@3: httpclient's TLS bridge (i18n's download_tzdb links it).
          brew install vulkan-headers vulkan-loader molten-vk glfw openssl@3

          # Homebrew on the x86_64 runner installs under /usr/local, not on the
          # linker's default search path; openssl@3 is keg-only, so add its lib dir.
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Install system libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Alire's gnat_native is a mingw-w64 toolchain, so its ld needs mingw
          # import libraries; take them from the preinstalled MSYS2.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          # openssl: httpclient's TLS bridge (i18n's download_tzdb links it).
          packages="mingw-w64-x86_64-vulkan-loader
                    mingw-w64-x86_64-glfw
                    mingw-w64-x86_64-openssl"

          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 15
          done

          if [ -z "$synced" ]; then
            echo "::warning::signed pacman sync failed; retrying without signature checks"
            sed 's/^SigLevel.*/SigLevel = Never/' /c/msys64/etc/pacman.conf \
              > /c/msys64/tmp/pacman-nosig.conf
            for attempt in 1 2 3; do
              if sync --config C:/msys64/tmp/pacman-nosig.conf; then synced=yes; break; fi
              echo "::warning::unsigned pacman sync attempt ${attempt} failed"
              sleep 15
            done
          fi

          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }

          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build search
        shell: bash
        working-directory: search
        run: alr --non-interactive build

      - name: Verify the i18n locale data was bundled
        shell: bash
        working-directory: search
        run: test -f share/i18n/formats.i18ndata

      - name: Build the search test suite
        shell: bash
        working-directory: search/search_tests
        run: alr --non-interactive build

      - name: Run the search test suite
        shell: bash
        working-directory: search/search_tests
        run: alr exec -- ./bin/search_tests

      - name: Run the release check
        shell: bash
        working-directory: search/search_tests
        run: alr exec -- ./bin/search_release_check
      # The render gate, as files runs its live smoke: search-desktop runs a
      # real search ("search" under the checkout itself, which finds its own
      # sources) and the frame is read back and checked for the query field
      # and the result rows, under Xvfb with Mesa's lavapipe software Vulkan.
      # "search-desktop smoke: PASS" must be printed: a window that finds no
      # font returns before rendering.
      - name: Live render smoke (Linux, software Vulkan)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        working-directory: search
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set +e
          out="$(xvfb-run -a ./bin/search-desktop --smoke . search 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::search-desktop --smoke exited with $code"
            exit "$code"
          fi
          if ! printf '%s\n' "$out" | tr -d '\r' | grep -qx "search-desktop smoke: PASS"; then
            echo "::error::search-desktop --smoke did not report PASS"
            exit 1
          fi

      # The same gate on the other hosts, with lavapipe set up exactly as files
      # sets it up: from MSYS2 on Windows (registered in HKLM too, because the
      # runner's elevated shell has a loader that ignores VK_ICD_FILENAMES),
      # from Homebrew on macOS (the Intel runner has no Metal device, so
      # MoltenVK is only the fallback).
      - name: Live render smoke (Windows and macOS, software Vulkan)
        if: runner.os != 'Linux'
        timeout-minutes: 30
        shell: bash
        working-directory: search
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set +e +o pipefail
          export VK_LOADER_DEBUG=error,warn
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            /c/msys64/usr/bin/pacman -S --noconfirm --needed --disable-download-timeout \
              mingw-w64-x86_64-mesa \
              || echo "::warning::could not install MSYS2 mesa"
            icd="$(ls /c/msys64/mingw64/share/vulkan/icd.d/*lvp*.json 2>/dev/null | head -1)"
            if [ -n "$icd" ]; then
              export VK_ICD_FILENAMES="$(cygpath -w "$icd")"
              reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' //v "$(cygpath -w "$icd")" //t REG_DWORD //d 0 //f \
                || echo "::warning::could not register the lavapipe driver"
            fi
            bin=./bin/search-desktop.exe
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install mesa || echo "::warning::could not install Homebrew mesa"
            icd="$(ls "$(brew --prefix)"/{share,etc}/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
            [ -n "$icd" ] || icd="$(ls "$(brew --prefix)"/{share,etc}/vulkan/icd.d/MoltenVK_icd.json 2>/dev/null | head -1)"
            if [ -n "$icd" ]; then
              export VK_ICD_FILENAMES="$icd"
            fi
            bin=./bin/search-desktop
            export MVK_CONFIG_LOG_LEVEL=2
          fi
          echo "VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-<unset>}"
          out="$("$bin" --smoke . search 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::search-desktop --smoke exited with $code on $MATRIX_OS"
            exit "$code"
          fi
          if ! printf '%s\n' "$out" | tr -d '\r' | grep -qx "search-desktop smoke: PASS"; then
            echo "::error::search-desktop --smoke did not report PASS on $MATRIX_OS"
            exit 1
          fi

      # A catalogue can be well-formed and still have drifted from the
      # messages it translates: a key with no original, an argument dropped so
      # the text renders without the value it was about, an option name
      # translated into a word the program rejects. The rule lives with the
      # catalogue format, in the messages crate.
      - name: Check the message catalogue
        shell: bash
        working-directory: messages/tools/catalog_check
        run: |
          alr --non-interactive build
          ./bin/catalog_check ../../../search/share/search.catalog \
            --verbatim=search
